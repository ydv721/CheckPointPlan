name: CHECKPOINT dependency and build check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate npm lockfile
        run: timeout 180s npm install --package-lock-only --ignore-scripts --no-audit --no-fund --fetch-timeout=30000 --fetch-retries=1

      - name: Commit lockfile when missing or changed
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add reproducible npm lockfile"
          git push

      - name: Install from lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Production build
        run: npm run build
